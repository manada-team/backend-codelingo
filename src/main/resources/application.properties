# Servidor
#server.port=8080

# Base de datos PostgreSQL
# Configurar estas variables de entorno en el servidor/docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codelingo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
# IMPORTANTE: cambiar el secret en produccion - debe ser una clave Base64 de al menos 256 bits
codelingo.jwt.secret=${JWT_SECRET:Y29kZWxpbmdvLXNlY3JldC1rZXktcGFyYS1kZXNhcnJvbGxvLWxvY2FsLTIwMjQ=}
codelingo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Nombre de la app
spring.application.name=backend-codelingo

logging.level.org.springframework.security=DEBUG
logging.level.com.codelingo=DEBUG

server.address=0.0.0.0
#server.port=8081
server.port=${PORT:8080}


